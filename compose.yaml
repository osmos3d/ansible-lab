services:
  controller:
    build: ./controller
    container_name: lab-controller
    hostname: controller
    working_dir: /workspace
    volumes:
      - ./playbooks:/workspace
      - ssh_keys:/keys
    networks:
      - ansible_lab
    depends_on:
      - node1
      - node2

  node1:
    build: ./nodes
    container_name: lab-node1
    hostname: node1
    volumes:
      - ssh_keys:/keys:ro
    networks:
      - ansible_lab

  node2:
    build: ./nodes
    container_name: lab-node2
    hostname: node2
    volumes:
      - ssh_keys:/keys:ro
    networks:
      - ansible_lab

  node3:
    build: ./nodes
    container_name: lab-node3
    hostname: node3
    volumes:
      - ssh_keys:/keys:ro
    networks:
      - ansible_lab

networks:
  ansible_lab:

volumes:
  ssh_keys:
